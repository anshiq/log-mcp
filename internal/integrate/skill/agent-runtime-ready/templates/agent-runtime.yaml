# agent-runtime.yaml — starter config
#
# Declare runnable apps for the agent-runtime MCP process supervisor.
# start_process(app="<name>") launches them; wait_for_log(ready=true) waits
# for the profile's readiness pattern; logs are pulled via get_logs.
#
# See reference/agent-runtime-yaml.md for the full field-by-field reference.

runtime:
  # Base env layer. "login" (default) captures the login-shell env once via
  # $SHELL -lic 'env -0' — this is what makes nvm/pyenv/uv shims and their
  # PATH entries reach managed processes. Pin "none" where determinism
  # matters (test configs): the base is then the parent process env.
  shell_env: login

  # Global env layer, applied to every app/process. Lower precedence than
  # env_file, app env, and request env. Uncomment to add:
  # env:
  #   - "NODE_ENV=development"

  # Log ring buffer size per stream (stdout/stderr).
  log_buffer_lines: 10000

  # SIGTERM -> SIGKILL grace period on stop_process (default 5s).
  stop_grace: 5s

  # Graceful-shutdown wait on runtime exit.
  shutdown_timeout: 5s

  # Optional durable SQLite log archive (server-side). The app never writes
  # log files; stdout/stderr only.
  # log_store: sqlite

apps:
  # Example entry (commented) — a Node API with workdir, env_file, and command:
  # api:
  #   type: node               # profile: readiness detection + default command
  #   workdir: ./services/api  # relative to THIS file; must exist; symlink-resolved
  #   env_file: .env           # dotenv, never logged
  #   command: ["node", "server.js"]

  # --- Ready-to-edit app stub -------------------------------------------
  api:
    type: node                 # nextjs | spring-boot | django | node | python | go
    workdir: ./app             # change to your app's directory
    # command: ["node", "server.js"]   # omit to use the profile default
    # env_file: .env
    # env:
    #   - "PORT=3000"
    #   - "PYTHONUNBUFFERED=1"  # required for Python: piped stdout is buffered

    # --- Optional v2 supervision (continuous health + auto-restart) -----
    # # Override the profile's readiness regexes (matched line-by-line).
    # readiness:
    #   - 'listening on :8080'
    # # Continuous health probe; after failure_threshold fails the app is
    # # reported unhealthy and (per restart.policy) restarted.
    # health_check:
    #   http: "http://localhost:8080/healthz"   # or tcp: "localhost:8080"
    #   interval: 10s
    #   timeout: 3s
    #   failure_threshold: 3
    # # Auto-restart. A manual stop_process never restarts.
    # restart:
    #   policy: on-failure        # never | on-failure | always
    #   backoff: [1s, 2s, 5s, 15s, 60s]
    #   max_restarts: 10          # per rolling 10-minute window

# Add more services the same way — each app gets its own workdir, env_file,
# env, buffers, and lifecycle. Same key in different env files stays isolated.
